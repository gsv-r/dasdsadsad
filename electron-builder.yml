appId: com.gsvr.kneedown
productName: Knee Down
executableName: KneeDown
directories:
  output: dist
  buildResources: resources
files:
  - 'out/**/*'
  - 'resources/**/*'
  - 'package.json'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: KneeDown
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Knee Down
  artifactName: 'KneeDown-${version}-Setup.${ext}'
  differentialPackage: true
  uninstallDisplayName: ${productName}
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: 'KneeDown-${version}.${ext}'
linux:
  target:
    - AppImage
    - deb
  maintainer: gsv-r
  category: Utility
appImage:
  artifactName: 'KneeDown-${version}.${ext}'
npmRebuild: false
publish:
  provider: github
  owner: gsv-r
  repo: knee-down
  private: false
  releaseType: release
